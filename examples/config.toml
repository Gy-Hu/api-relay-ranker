# RelayRank v3 configuration. Every value here is a modelling choice; record why it changed,
# and never tune it to move a particular vendor.

[aggregation]
half_life_days = 30
max_age_days = 90
unknown_date_weight = 0.25
prior_score = 50          # neutral: the median position inside each source
prior_strength = 0.8      # roughly one fresh source's worth of shrinkage
minimum_sources = 2
minimum_peers = 5         # a source needs this many scorable vendors for percentiles
coverage_weight = 0.25   # weaker evidence still scores, but cannot qualify a vendor by itself
sample_prior = 3          # Veridrop weight factor n / (n + 3)

# Operating age is shown and filtered on, never multiplied into the score: there is no
# runaway history yet to calibrate such a factor. Expired domains are a hard exclusion.
[longevity]
min_operating_days = 90   # vendors without evidence of this many days are hidden by default

# reliability reflects what the source actually measures, not how much we like its ranking.
[[sources]]
name = "helpaio"
reliability = 0.90        # self-funded tests; score = base x 3-day uptime x penalty
group = "helpaio"

[[sources]]
name = "relaypick"
reliability = 0.70        # single US probe, non-5xx counts as up; authenticity mostly unsampled
group = "relaypick"

[[sources]]
name = "okkmax"
reliability = 0.85        # per-group real requests, availability + speed + Claude purity
group = "okkmax"          # fanbidog/ai-relay-rank mirrors this lineage: never add it separately

[[sources]]
name = "veridrop"
reliability = 0.80        # community-triggered detection reports; uneven sampling
group = "veridrop"        # chunduai.com re-publishes Veridrop reports: same group if ever added
window_days = 60          # median over valid reports in the last 60 days

# Vendors are joined across sources by registrable domain. List every domain a vendor operates
# (main site and API hosts collapse to the same registrable domain). Unlisted domains still rank
# under the source's display name, but are never merged with anything by name similarity.
[[vendors]]
name = "Micu"
domains = ["micuapi.ai"]

