name: Update ranking and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      allow_partial:
        description: "Deploy when a source is unavailable"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: relayrank-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install RelayRank
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Fetch sources and build the ranking
        run: >-
          relayrank live
          --config examples/config.toml
          --top 30
          --timeout 45
          --snapshot-dir build/snapshots
          --output-dir build/outputs
          --site-dir build/site
          ${{ inputs.allow_partial && '--allow-partial' || '' }}
          --site-url https://gy-hu.github.io/api-relay-ranker/
          --og-image assets/relayrank-og.png

      - name: Summarize source coverage
        if: always()
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          path = Path("build/outputs/sources.json")
          if not path.exists():
              raise SystemExit(0)
          lines = ["## Sources", "", "| Source | Status | Scored / listed | Error |", "|---|---|---:|---|"]
          for r in json.loads(path.read_text()):
              status = "ok" if r["ok"] else "failed"
              lines.append(f"| {r['name']} | {status} | {r['valid_count']} / {r['vendor_count']} | {r['error'] or ''} |")
              if not r["ok"]:
                  print(f"::warning::{r['name']}: {r['error']}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write("\n".join(lines) + "\n")
          PYTHON

      - name: Preserve audit data and raw snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relayrank-audit-${{ github.run_id }}
          path: |
            build/outputs
            build/snapshots
          if-no-files-found: ignore
          retention-days: 30

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
